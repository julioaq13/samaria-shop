<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SAMARIA Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-brand">SAMARIA</h1>
            <p class="login-subtitle">Acceso al Panel de Administración</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="login-alerts">
                    {% for category, message in messages %}
                        <div class="flash-alert flash-{{ category }}">
                            <span class="flash-text">{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" class="login-form">
            <div class="form-group">
                <label for="username" class="form-label"><i class="fa-solid fa-user"></i> Usuario</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Nombre de usuario">
            </div>

            <div class="form-group">
                <label for="password" class="form-label"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Contraseña de acceso">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar al Panel
            </button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('public.index') }}"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</a>
        </div>
    </div>
</body>
</html>
